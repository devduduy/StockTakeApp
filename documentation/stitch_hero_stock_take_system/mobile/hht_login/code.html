<body class="bg-surface-container-lowest text-on-surface min-h-screen flex flex-col font-body-md antialiased selection:bg-primary-fixed-dim selection:text-primary">
<main class="flex-1 flex flex-col justify-center items-center px-margin-mobile w-full max-w-md mx-auto">
<div class="w-full mb-xl flex flex-col items-center">
<img alt="Hero Logo" class="w-48 mb-lg object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD9ipw_xRo8CV_OiRrZ3dfWLNo_Y-GLjsyDKhELKIovzU7fX7ZjuLtSWGPlT55NkZjyl4atzokufAGc3s7qolmot8c5G_WLwlKnFbSid3Skg7n3DNBK8-BgTNEC5zQRXIYsZjubq40hSlgAeuAlmLz4N1ydFM8tiFUPioWaEkhFRnr9dW-KcTEojt1yLSJO1klAu4stiAYbgQd7js47GAwuK5cELHdv2Vmfs5g4I81K51s1HBVbtQA_J2DcqMmUYWV0oQ"/>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary text-center">Mobile Stock Take System</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-sm text-center">Authorized personnel only.</p>
</div>
<form class="w-full space-y-md" onsubmit="event.preventDefault(); window.location.href='#';">
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface block" for="username">Username / Employee ID</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">person</span>
</div>
<input class="w-full pl-xl pr-md py-sm bg-surface border border-outline-variant rounded focus:border-primary focus:ring-0 transition-colors h-[48px] font-body-md text-body-md" id="username" name="username" placeholder="Enter ID" required="" type="text"/>
</div>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface block" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="w-full pl-xl pr-xl py-sm bg-surface border border-outline-variant rounded focus:border-primary focus:ring-0 transition-colors h-[48px] font-body-md text-body-md" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-sm flex items-center text-outline hover:text-primary transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="visibility-icon">visibility_off</span>
</button>
</div>
</div>
<div class="flex items-center justify-between mt-sm mb-lg">
<div class="flex items-center">
<input class="w-4 h-4 text-primary bg-surface border-outline-variant rounded focus:ring-primary focus:ring-2" id="remember" type="checkbox"/>
<label class="ml-2 font-body-sm text-body-sm text-on-surface-variant" for="remember">Remember me</label>
</div>
<a class="font-label-sm text-label-sm text-primary hover:underline" href="#">Need help?</a>
</div>
<button class="w-full h-[48px] bg-primary text-on-primary font-label-md text-label-md rounded flex justify-center items-center active:scale-[0.98] transition-transform shadow-sm" type="submit">
                LOGIN
                <span class="material-symbols-outlined ml-sm text-[20px]">arrow_forward</span>
</button>
</form>
</main>
<footer class="w-full py-md text-center border-t border-outline-variant/30 mt-auto">
<p class="font-label-sm text-label-sm text-on-surface-variant flex items-center justify-center gap-sm">
<span class="material-symbols-outlined text-[16px]">inventory_2</span>
            v4.2.0 | Retail Operations
        </p>
</footer>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const visibilityIcon = document.getElementById('visibility-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                visibilityIcon.textContent = 'visibility';
            } else {
                passwordInput.type = 'password';
                visibilityIcon.textContent = 'visibility_off';
            }
        }
    </script>
